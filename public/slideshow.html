<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photobooth Slideshow</title>
  <link rel="stylesheet" href="slideshow-style.css">
</head>
<body>
  <div class="slideshow-container">
    <div class="slide" id="currentSlide">
      <img id="slideImage" src="" alt="Photo">
      <div class="slide-info" id="slideInfo"></div>
    </div>
    
    <div class="slideshow-controls">
      <button class="control-btn" id="prevBtn" title="Previous">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <button class="control-btn play-pause" id="playPauseBtn" title="Pause">
        <svg class="icon-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <svg class="icon-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10 5h4v14h-4zM6 5h4v14H6z"/>
        </svg>
      </button>
      <button class="control-btn" id="nextBtn" title="Next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </div>
  
  <div class="loading-indicator" id="loadingIndicator">
    <div class="spinner"></div>
    <p>Loading photos...</p>
  </div>
  
  <script src="slideshow-script.js"></script>
</body>
</html>
